name: Sync to S3

on:
  push:
    branches:
      - main
      
jobs:
  sync-to-s3:
    environment: justinkinney-web
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        
      - name: Build site
        run: npm run build

      - name: Rebuild gallery data
        run: node scripts/generate-gallery-index.mjs --bucket ${{ secrets.S3_BUCKET }} --prefix ${{ secrets.S3_GALLERY_PREFIX }} --base-url ${{ secrets.S3_GALLERY_BASEURL }} --out public/gallery-data.js

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "media/*" \
            --exclude ".gitignore"

      - name: Invalidate cloudfront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
